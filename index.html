<!DOCTYPE html>
<html lang="en">
<head>

    <title>Math Game</title>

<body class="bg-[#12E0E7] ">

    <div class="flex flex-col justify-center items-center ">
        <div class="mt-[30px] bg-sky-500 rounded-[22px] w-[700px] h-[200px] flex flex-col justify-center items-center">
            <h3 id="mathProblem" class="
            text-yellow-300  text-[120px]"></h3>
        </div>
        <div class="flex gap-[100px] justify-center items-center text-[34px]  absolute top-[200px] ">
            <div class="bg-[#F27D7D] shadow-2xl text-yellow-300 w-[150px] rounded-[12px] flex flex-col justify-center items-center p-[2px] min-h-[50px]">&#x1F44C;-  0</div>
            <div class="bg-[#F27D7D] shadow-2xl text-yellow-300 w-[150px] rounded-[12px] flex flex-col justify-center items-center p-[2px] min-h-[50px]">0s</div>

        </div>
    
   <div id="box" class="grid mt-[50px] grid-rows-4 grid-cols-4 w-[400px] h-[400px] border-[3px] mt-[60px]
    [&>span]:hover:bg-sky-500 [&>span]:hover:shadow-[0px_0px_10px_#EB9F0E] [&>span]:hover:rounded-[50px] [&>span]:duration-500 
   [&>span:nth-child(1)]:bg-yellow-300
  [&>span:nth-child(2)]:bg-white
  [&>span:nth-child(3)]:bg-yellow-300
  [&>span:nth-child(4)]:bg-white
  [&>span:nth-child(5)]:bg-white
  [&>span:nth-child(6)]:bg-yellow-300

  [&>span:nth-child(8)]:bg-yellow-300
  [&>span:nth-child(9)]:bg-yellow-300
  [&>span:nth-child(10)]:bg-white
  [&>span:nth-child(11)]:bg-yellow-300
  [&>span:nth-child(12)]:bg-white
  [&>span:nth-child(13)]:bg-white
  [&>span:nth-child(14)]:bg-yellow-300
  [&>span:nth-child(15)]:bg-white
  [&>span:nth-child(16)]:bg-yellow-300
  hover:bg-sky-500 hover:shadow-[0px_0px_10px_#fff] hover:rounded-[95px]  duration-500 
  [&>span]:border-[2px] [&>span]:border-sky-500
  [&>span]:flex [&>span]:justify-center [&>span]:items-center
  [&>span]:p-[4px] [&>span]:h-[100px] [&>span]:text-sky-500 [&>span]:font-bold [&>span]:text-[34px]">
</div>

    </div>
